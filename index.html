<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewbFixer Liveries.</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <!-- ========================================================= -->

 <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: radial-gradient(circle at 50% 0%, #0b1220 0%, #090b0e, 45%, #03040a 100%);
            color: #f4f5f7;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --bg: #090b0e;
            --bg-light: #0e1115;
            --panel: #12161b;
            --panel-hover: #171c22;

            --text: #f4f5f7;
            --muted: #8e98a5;

            --accent: #00bee8;
            --accent-dark: #390000;

            --border: rgba(255,255,255,0.08);

            --max-width: 1200px;
        }


        /* =========================================================
           BACKGROUND EFFECT
        ========================================================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 70%
            );

            z-index: -2;
        }

    


/* =========================================================
   NAVIGATION
========================================================= */


header {
    position: relative;

    width: 100%;
    height: 76px;

    display: flex;
    align-items: center;

    

    z-index: 10;
}

.nav {
    width: min(var(--max-width), calc(100% - 40px));

    height: 100%;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}


/* LOGO */

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-weight: 800;
    letter-spacing: 1px;
}

.logo-mark {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    background: var(--accent);

    color: #080a0c;

    font-weight: 950;

    border-radius: 6px;

    transform: skew(-8deg);
}

.logo-text {
    display: flex;
    flex-direction: column;

    line-height: 1;
}

.logo-text strong {
    font-size: 15px;
}

.logo-text span {
    margin-top: 4px;

    font-size: 9px;

    color: var(--muted);

    letter-spacing: 2px;
}


/* NAV LINKS */

nav {
    display: flex;
    align-items: center;
    gap: 32px;
}

nav a {
    color: #aab2bc;

    font-size: 14px;
    font-weight: 600;

    transition: 0.2s ease;
}

nav a:hover {
    color: var(--accent);
}


/* DOWNLOAD */

.nav-download {
    padding: 10px 18px;

    background: #e438c6;

    color: #080a0c !important;

    border-radius: 5px;

    font-weight: 800;
}

.nav-download:hover {
    background: #39ffb6;

    transform: translateY(-1px);
}

        /* =========================================================
           HERO
        ========================================================= */
        
        .sitelogo {

            width: min(var(--max-width), calc(100% - 40px));

            margin: auto;

            
            align-items: center;

           

            position: relative;
        }

        .hero {

            width: min(var(--max-width), calc(100% - 40px));

            margin: auto;

            display: flex;
            align-items: center;

            padding-top: 40px;

            position: relative;
        }

        .hero-content {
            width: 65%;

            position: relative;

            z-index: 2;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 7px 12px;

            margin-bottom: 25px;

            border: 1px solid #8560ff;

            background: rgba(183,255,50,0.04);

            border-radius: 100px;

            color: #ff26d9;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";

            width: 7px;
            height: 7px;

            background: var(--accent);

            border-radius: 50%;

            box-shadow: 0 0 12px var(--accent);
        }

        h1 {
            max-width: 800px;

            font-size: clamp(58px, 8vw, 105px);

            line-height: 0.9;

            letter-spacing: -5px;

            font-weight: 900;

            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
        }

        .hero-subtitle {
            max-width: 620px;

            margin-top: 30px;

            color: var(--muted);

            font-size: 19px;

            line-height: 1.7;
        }

        .hero-actions {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-top: 38px;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 50px;

            padding: 0 24px;

            border-radius: 7px;

            font-size: 14px;
            font-weight: 800;

            transition: 0.2s ease;

            cursor: pointer;
        }

        .button-primary {
            background: #e537c7;

            color: #080a0c;

            box-shadow:
                0 0 30px rgba(183,255,50,0.12);
        }

        .button-primary:hover {
            background: #39ffb6;

            transform: translateY(-2px);

            box-shadow:
                0 10px 35px rgba(183,255,50,0.18);
        }

        .button-secondary {
            border: 1px solid #39ffb6;

            color: #d9dde2;

            background: rgba(255,255,255,0.025);
        }

        .button-secondary:hover {
            border-color: #e537c7;

            color: var(--accent);
        }


        /* =========================================================
           HERO GRAPHIC
        ========================================================= */

        .hero-graphic {
            position: absolute;

            right: -80px;
            bottom: 70px;

            width: 480px;
            height: 480px;

            opacity: 0.9;

            pointer-events: none;
        }

        .circle {
            position: absolute;

            inset: 0;

            border-radius: 50%;

            border: 1px solid rgba(183,255,50,0.12);

            transform: rotate(-15deg);
        }

        .circle::before,
        .circle::after {
            content: "";

            position: absolute;

            inset: 45px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.05);
        }

        .circle::after {
            inset: 100px;

            border-color: rgba(183,255,50,0.15);
        }

        .speed-line {
            position: absolute;

            height: 2px;

            background: var(--accent);

            opacity: 0.35;

            transform: rotate(-25deg);
        }

        .speed-line:nth-child(2) {
            width: 250px;
            top: 160px;
            left: 80px;
        }

        .speed-line:nth-child(3) {
            width: 170px;
            top: 205px;
            left: 150px;
        }

        .speed-line:nth-child(4) {
            width: 300px;
            top: 275px;
            left: 50px;
        }

        .speed-line:nth-child(5) {
            width: 120px;
            top: 330px;
            left: 190px;
        }

        .graphic-center {
            position: absolute;

            inset: 0;

            display: grid;

            place-items: center;
        }

        .graphic-center strong {
            font-size: 110px;

            font-weight: 950;

            color: transparent;

            -webkit-text-stroke: 1px rgba(183,255,50,0.25);

            transform: skew(-10deg);

            letter-spacing: -8px;
        }


        /* =========================================================
           SECTION
        ========================================================= */

        section {
            padding: 60px 20px;
        }

        .container {
            width: min(var(--max-width), 100%);

            margin: auto;
        }

        .section-label {
            color: var(--accent);

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 15px;
        }

        .section-title {
            max-width: 720px;

            font-size: clamp(36px, 5vw, 62px);

            line-height: 1;

            letter-spacing: -2px;

            font-weight: 850;
        }

        .section-description {
            max-width: 650px;

            margin-top: 20px;

            color: var(--muted);

            font-size: 17px;
        }


        /* =========================================================
           FEATURES
        ========================================================= */

        .features {
            background: #0b0e12;

            border-top: 1px solid var(--border);

            border-bottom: 1px solid var(--border);
        }

        .feature-grid {
            margin-top: 55px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;
        }

        .feature {
            padding: 30px;

            min-height: 220px;

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 10px;

            transition: 0.25s ease;
        }

        .feature:hover {
            transform: translateY(-5px);

            background: var(--panel-hover);

            border-color: #e537c7;
        }

        .feature-icon {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            margin-bottom: 20px;

            background: #3c2c7c;

            color: var(--accent);

            border-radius: 8px;

            font-size: 20px;
        }

        .feature h3 {
            font-size: 18px;

            margin-bottom: 10px;
        }

        .feature p {
            color: var(--muted);

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================================================
           HOW IT WORKS
        ========================================================= */

        .steps {
            margin-top: 65px;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 15px;
        }

        .step {
            position: relative;

            padding: 30px;

            border-top: 1px solid var(--border);
        }

        .step-number {
            font-size: 12px;

            font-weight: 900;

            color: var(--accent);

            letter-spacing: 2px;

            margin-bottom: 40px;
        }

        .step h3 {
            font-size: 20px;

            margin-bottom: 10px;
        }

        .step p {
            color: var(--muted);

            font-size: 14px;
        }


        /* =========================================================
           BIG STATEMENT
        ========================================================= */

        .statement {
            text-align: center;

            padding-top: 150px;
            padding-bottom: 150px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(183,255,50,0.07),
                    transparent 50%
                );
        }

        .statement h2 {
            max-width: 950px;

            margin: auto;

            font-size: clamp(42px, 7vw, 88px);

            line-height: 0.95;

            letter-spacing: -4px;

            text-transform: uppercase;
        }

        .statement h2 span {
            color: var(--accent);
        }

        .statement p {
            max-width: 600px;

            margin: 30px auto 0;

            color: var(--muted);

            font-size: 17px;
        }


        /* =========================================================
           CTA
        ========================================================= */

        .cta {
            padding-top: 80px;
            padding-bottom: 100px;
        }

        .cta-box {
            position: relative;

            overflow: hidden;

            padding: 70px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #151a20,
                #0d1014
            );

            border: 1px solid var(--border);
        }

        .cta-box::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            right: -100px;
            top: -100px;

            border-radius: 50%;

            border: 1px solid rgba(183,255,50,0.12);
        }

        .cta-box h2 {
            position: relative;

            z-index: 2;

            max-width: 650px;

            font-size: clamp(38px, 5vw, 60px);

            line-height: 1;

            letter-spacing: -2px;
        }

        .cta-box p {
            position: relative;

            z-index: 2;

            max-width: 550px;

            margin-top: 18px;

            color: var(--muted);
        }

        .cta-box .button {
            position: relative;

            z-index: 2;

            margin-top: 30px;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding: 40px 20px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            font-size: 12px;
        }

        .footer-inner {
            width: min(var(--max-width), 100%);

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .footer-brand {
            color: #dce0e4;

            font-weight: 800;

            letter-spacing: 1px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {

            nav a:not(.nav-download) {
                display: none;
            }

            .hero-content {
                width: 100%;
            }

            .hero-graphic {
                right: -220px;
                opacity: 0.35;
            }

            .feature-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .steps {
                grid-template-columns: repeat(2, 1fr);
            }
        }


        @media (max-width: 600px) {

            header {
                height: 68px;
            }

            .nav {
                width: calc(100% - 28px);
            }

            .logo-text {
                display: none;
            }

            .hero {
                width: calc(100% - 30px);

             

                padding-top: 100px;
            }

            h1 {
                font-size: 58px;

                letter-spacing: -3px;
            }

            .hero-subtitle {
                font-size: 16px;
            }

            .hero-actions {
                flex-direction: column;

                align-items: stretch;
            }

            .button {
                width: 100%;
            }

            .hero-graphic {
                width: 350px;
                height: 350px;

                right: -220px;
                bottom: 40px;
            }

            section {
                padding: 80px 15px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .steps {
                grid-template-columns: 1fr;
            }

            .cta-box {
                padding: 40px 25px;
            }

            .footer-inner {
                flex-direction: column;

                gap: 12px;

                text-align: center;
            }
        }
        /* =========================================================
           GALLERY / MEDIA SECTION
        ========================================================= */

        .media-section {
            background: #0b0e12;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .media-grid {
            margin-top: 55px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .media-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: 0.25s ease;
        }

        .media-card:hover {
            border-color: #e537c7;
        }

        .media-card h3 {
            padding: 12px 20px 10px 20px;
            font-size: 14px;
        }

        .media-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .media-container img,
        .media-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }

        @media (max-width: 900px) {
            .media-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* ================ MODAL ============================= */
        .action-btn {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 6px 12px;
            font-family: monospace;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 0.08em;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            border-color: #ff1e1e;
            color: #ff1e1e;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(10, 10, 10, 0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            position: relative;
            max-width: 100%;
            max-height: 85vh;
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }
        .help-image {
		    cursor: pointer;
		    display: block;
		    max-width: 100%;
		    transition: transform 0.2s ease, opacity 0.2s ease;
				}

    </style>
   
</head>
