<style>
/* Additional Gallery Specific Styles matching style4.css variables */
.gallery-section-wrapper {
    margin-bottom: 40px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.folder-btn {
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 10px 18px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.folder-btn:hover {
    border-color: var(--accent-orange);
    transform: translateY(-2px);
}

.folder-btn.active {
    background-color: var(--accent-orange);
    color: #fff;
    border-color: var(--accent-orange);
    box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
}

.folder-title {
    text-align: center;
    margin: 15px 0;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-blue);
    font-family: var(--font-heading);
}
.showcase-title {
    text-align: center;
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--accent-blue);
    font-family: var(--font-heading);
}
.showcase-title-orange {
    text-align: center;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--accent-orange);
    font-family: var(--font-heading);
}
.showcase-img {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 12px;
}

/* Main 100% width preview image */
.main-hero-img {
    width: 100% !important;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.main-hero-img:hover {
    transform: scale(1.01);
    border-color: var(--accent-blue);
}

/* Container wrapper for the thumbnails below */
.thumbnail-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
}

/* The 5 equal thumbnails below */
.thumb-img {
    flex: 0 0 calc(20% - 6.4px);
    min-width: 0; /* Fixes images popping out of flex containers */
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.thumb-img:hover {
    transform: scale(1.03);
    border-color: var(--accent-blue);
}

/* Optional: Shrink thumbnail height slightly on smaller mobile screens */
@media (max-width: 480px) {
    .main-hero-img {
        height: 240px;
    }
    .thumb-img {
        height: 60px;
    }
}


.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 16px;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.gallery img:hover {
    transform: scale(1.02);
    border-color: var(--accent-blue);
}

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(9, 10, 15, 0.95);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

#lightboxContent {
    text-align: center;
    position: relative;
    max-width: 95vw;
    max-height: 90vh;
}

#lightboxImg {
    max-width: 90vw;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: transform 0.2s ease, opacity 0.25s ease;
}

#imageCounter {
    color: var(--text-muted);
    font-size: 16px;
    margin-bottom: 12px;
    font-weight: 600;
    letter-spacing: 1px;
}

.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.08);
    color: white;
    border: 1px solid var(--border-color);
    font-size: 35px;
    padding: 15px 20px;
    cursor: pointer;
    user-select: none;
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
}

.nav-btn:hover {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
}

#prevBtn {
    left: 30px;
}

#nextBtn {
    right: 30px;
}
.review-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            background: var(--bg-card, #12151c);
            border: 1px solid var(--border-color, #222634);
            border-radius: 8px;
            padding: 20px 24px;
            position: relative;
            width: 100%;
            
        }
.reviews-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            margin-bottom:20px;
        }
</style>
</head>
<body>
	
	<script src="scripts/showcaseData.js"></script>
	
    <header class="header">
        <div class="container nav-container">
            <div class="logo-area">
                <a href="index.html"> <span class="logo-text-blue">Newb</span><span class="logo-text-orange">Fixer</span> <span class="logo-text-white">Liveries</span></a>

        <div class="container center">
            <div class="badge">PORTFOLIO ARCHIVE</div>

            <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 16px;">Browse through custom ACC liveries, team designs, and public releases.</p>

        </div>
    </section>
    
  <div class="container" style="padding-top: 40px; padding-bottom: 60px;">
	
	
				<div class="reviews-grid" id="showcaseContainer"></div>


 

</div>

<!-- Fullscreen image viewer -->
<div id="lightbox">
    <button id="prevBtn" class="nav-btn">&#10094;</button>
    <div id="lightboxContent">
        <div id="imageCounter"></div>
        <img id="lightboxImg" src="" alt="">
    </div>
    <button id="nextBtn" class="nav-btn">&#10095;</button>
</div>

<script>


const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const imageCounter = document.getElementById("imageCounter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentImages = [];
let currentIndex = 0;
let zoomLevel = 1;




// Automatically build the cards and scope lightbox arrays individually
const showcaseContainer = document.getElementById("showcaseContainer");
showcaseData.forEach(cardData => {
    const card = document.createElement("div");
    card.className = "review-card";

    // Build card HTML structure
    card.innerHTML = `
        <div style="width:100%">
            <span class="showcase-title">${cardData.team}</span>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0px 4px 0px;">
        </div>
        <div>
            <span class="showcase-title-orange" style="font-size:11px;">Car Model</span>
            <span style="font-size:13px;">${cardData.carModel}</span>
        </div>
        <div>
            <span class="showcase-title-orange" style="font-size:11px;">Livery Type</span> 
            <span style="font-size:13px;">${cardData.type}</span>
        </div>
        <div class="showcase-img" style="text-align:center;"></div>
    `;

    const imgContainer = card.querySelector(".showcase-img");
    
    // Map image sources specifically for this card group
    const cardImageSources = cardData.images.map(imgSrc => imgSrc);

    // Main full-width image (Index 0)
    if (cardData.images.length > 0) {
        const mainImg = document.createElement("img");
        mainImg.src = cardData.images[0];
        mainImg.className = "main-hero-img";
        mainImg.loading = "lazy";
        mainImg.addEventListener("click", () => {
            currentImages = cardImageSources;
            openLightbox(0);
        });
        imgContainer.appendChild(mainImg);
    }

    // Remaining thumbnails wrapper (Indices 1 to 5)
    if (cardData.images.length > 1) {
        const thumbRow = document.createElement("div");
        thumbRow.className = "thumbnail-row";

        for (let i = 1; i < cardData.images.length; i++) {
            const thumbImg = document.createElement("img");
            thumbImg.src = cardData.images[i];
            thumbImg.className = "thumb-img";
            thumbImg.loading = "lazy";
            
            const currentIndexRef = i;
            thumbImg.addEventListener("click", () => {
                currentImages = cardImageSources;
                openLightbox(currentIndexRef);
            });

            thumbRow.appendChild(thumbImg);
        }
        imgContainer.appendChild(thumbRow);
    }

    showcaseContainer.appendChild(card);
});

function showImage(index, direction = 0) {
    currentIndex = index;
    lightboxImg.style.opacity = 0;
    setTimeout(() => {
        lightboxImg.src = currentImages[index];
        imageCounter.textContent = `${index + 1} / ${currentImages.length}`;
        zoomLevel = 1;
        lightboxImg.style.transform = "scale(1)";
        lightboxImg.style.opacity = 1;
    }, 150);
}

function openLightbox(index) {
    lightbox.style.display = "flex";
    showImage(index);
}

function nextImage() {
    currentIndex = (currentIndex + 1) % currentImages.length;
    showImage(currentIndex, 1);
}

function prevImage() {
    currentIndex--;
    if (currentIndex < 0) currentIndex = currentImages.length - 1;
    showImage(currentIndex, -1);
}


prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevImage(); });
nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextImage(); });

lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
        zoomLevel = 1;
        lightboxImg.style.transform = "scale(1)";
    }
});

document.addEventListener("keydown", (e) => {
    if (lightbox.style.display !== "flex") return;
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
    if (e.key === "Escape") lightbox.style.display = "none";
});

lightboxImg.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.deltaY < 0) {
        zoomLevel += 0.1;
    } else {
        zoomLevel -= 0.1;
    }
    zoomLevel = Math.max(0.5, Math.min(5, zoomLevel));
    lightboxImg.style.transform = `scale(${zoomLevel})`;
}, { passive: false });
</script>
