<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewbFixer Livery Gallery</title>

<style>
:root {
    --accent-blue: #38bdf8;
    --accent-orange: #f97316;
    --bg-dark: #090a0f;
    --bg-card: #12151f;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border-color: #1f2937;
}

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 30px;
    color: #fff;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.folder-btn {
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.folder-btn:hover {
    border-color: var(--accent-orange);
    transform: translateY(-2px);
}

.folder-btn.active {
    background-color: var(--accent-orange);
    color: #fff;
    border-color: var(--accent-orange);
    box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
}

.gallery-container {
    max-width: 1200px;
    margin: 0 auto;
}

.folder-title {
    text-align: center;
    margin: 20px 0;
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-blue);
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 16px;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.gallery img:hover {
    transform: scale(1.02);
    border-color: var(--accent-blue);
}

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(9, 10, 15, 0.95);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

#lightboxContent {
    text-align: center;
    position: relative;
    max-width: 95vw;
    max-height: 90vh;
}

#lightboxImg {
    max-width: 90vw;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: transform 0.2s ease, opacity 0.25s ease;
}

#imageCounter {
    color: var(--text-muted);
    font-size: 16px;
    margin-bottom: 12px;
    font-weight: 600;
    letter-spacing: 1px;
}

.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.08);
    color: white;
    border: 1px solid var(--border-color);
    font-size: 35px;
    padding: 15px 20px;
    cursor: pointer;
    user-select: none;
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
}

.nav-btn:hover {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
}

#prevBtn { left: 30px; }
#nextBtn { right: 30px; }
</style>
</head>
<body>

<h1>NewbFixer Livery Gallery</h1>

<div class="controls" id="folderButtonsContainer">
    <p style="color: var(--text-muted); text-align: center; width: 100%;">Reading liveries folders...</p>
</div>

<div class="gallery-container">
    <div class="folder-title" id="folderTitle">Select a vehicle category above</div>
    <div class="gallery" id="gallery"></div>
</div>

<div id="lightbox">
    <button id="prevBtn" class="nav-btn">&#10094;</button>
    <div id="lightboxContent">
        <div id="imageCounter"></div>
        <img id="lightboxImg" src="" alt="">
    </div>
    <button id="nextBtn" class="nav-btn">&#10095;</button>
</div>

<script>
const buttonContainer = document.getElementById("folderButtonsContainer");
const gallery = document.getElementById("gallery");
const title = document.getElementById("folderTitle");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const imageCounter = document.getElementById("imageCounter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentImages = [];
let currentIndex = 0;
let zoomLevel = 1;

function showImage(index) {
    currentIndex = index;
    lightboxImg.style.opacity = 0;
    setTimeout(() => {
        lightboxImg.src = currentImages[index];
        imageCounter.textContent = `${index + 1} / ${currentImages.length}`;
        zoomLevel = 1;
        lightboxImg.style.transform = "scale(1)";
        lightboxImg.style.opacity = 1;
    }, 150);
}

function openLightbox(index) {
    lightbox.style.display = "flex";
    showImage(index);
}

function nextImage() {
    currentIndex = (currentIndex + 1) % currentImages.length;
    showImage(currentIndex);
}

function prevImage() {
    currentIndex--;
    if (currentIndex < 0) currentIndex = currentImages.length - 1;
    showImage(currentIndex);
}

// Automatically scan the specific vehicle subfolder and capture whatever image filenames exist inside
async function loadFolderImages(folderName) {
    gallery.innerHTML = "";
    title.textContent = folderName.replaceAll("_", " ");
    currentImages = [];

    try {
        const response = await fetch(`liveries/${folderName}/`);
        if (!response.ok) throw new Error("Could not read folder listing");
        const htmlText = await response.text();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const links = doc.querySelectorAll('a');
        
        let imageFiles = [];
        links.forEach(link => {
            let href = link.getAttribute('href');
            if (href) {
                href = href.split('/').pop();
                // Match image files dynamically regardless of naming convention (webp, jpg, png, etc.)
                const lower = href.toLowerCase();
                if (lower.endsWith('.webp') || lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.png')) {
                    const imageName = decodeURIComponent(href);
                    if (!imageFiles.includes(imageName)) {
                        imageFiles.push(imageName);
                    }
                }
            }
        });

        if (imageFiles.length === 0) {
            gallery.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align:center;">No images found inside <b>liveries/${folderName}/</b></p>`;
            return;
        }

        imageFiles.sort().forEach(file => {
            const imagePath = `liveries/${folderName}/${file}`;
            currentImages.push(imagePath);

            const img = document.createElement("img");
            img.src = imagePath;
            img.loading = "lazy";
            
            const capturedIndex = currentImages.length - 1;
            img.addEventListener("click", () => openLightbox(capturedIndex));
            gallery.appendChild(img);
        });

    } catch (error) {
        gallery.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align:center;">Error loading folder files. Please ensure directory listing is enabled on your host.</p>`;
    }
}

// Automatically scan root "liveries/" folder to build buttons dynamically
async function initGallery() {
    try {
        const response = await fetch('liveries/');
        if (!response.ok) throw new Error("Could not read liveries directory");
        const htmlText = await response.text();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const links = doc.querySelectorAll('a');
        
        let folders = [];
        links.forEach(link => {
            let href = link.getAttribute('href');
            if (href) {
                href = href.replace(/\/$/, "").split('/').pop();
                if (href && href !== "." && href !== ".." && !href.includes("?") && !href.includes(".")) {
                    const folderName = decodeURIComponent(href);
                    if (!folders.includes(folderName)) {
                        folders.push(folderName);
                    }
                }
            }
        });

        if (folders.length === 0) {
            buttonContainer.innerHTML = `<p style="color: var(--text-muted);">No subfolders found inside the <b>liveries/</b> directory.</p>`;
            return;
        }

        buttonContainer.innerHTML = "";
        folders.sort().forEach(folder => {
            const btn = document.createElement("button");
            btn.className = "folder-btn";
            btn.textContent = folder.replaceAll("_", " ");
            
            btn.addEventListener("click", () => {
                document.querySelectorAll(".folder-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                loadFolderImages(folder);
            });

            buttonContainer.appendChild(btn);
        });

    } catch (e) {
        buttonContainer.innerHTML = `<p style="color: var(--text-muted); text-align:center;">Directory listing is disabled. Enable directory listing in your host configuration to read folders automatically.</p>`;
    }
}

prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevImage(); });
nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextImage(); });

lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
        zoomLevel = 1;
        lightboxImg.style.transform = "scale(1)";
    }
});

document.addEventListener("keydown", (e) => {
    if (lightbox.style.display !== "flex") return;
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
    if (e.key === "Escape") lightbox.style.display = "none";
});

lightboxImg.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomLevel = Math.max(0.5, Math.min(5, zoomLevel + (e.deltaY < 0 ? 0.1 : -0.1)));
    lightboxImg.style.transform = `scale(${zoomLevel})`;
}, { passive: false });

initGallery();
</script>

</body>
</html>
