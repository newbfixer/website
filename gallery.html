<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewbFixer Livery Gallery</title>

<style>
:root {
    --accent-blue: #38bdf8;
    --accent-orange: #f97316;
    --bg-dark: #090a0f;
    --bg-card: #12151f;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border-color: #1f2937;
}

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 30px;
    color: #fff;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.folder-btn {
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.folder-btn:hover {
    border-color: var(--accent-orange);
    transform: translateY(-2px);
}

.folder-btn.active {
    background-color: var(--accent-orange);
    color: #fff;
    border-color: var(--accent-orange);
    box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
}

.gallery-container {
    max-width: 1200px;
    margin: 0 auto;
}

.folder-title {
    text-align: center;
    margin: 20px 0;
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-blue);
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 16px;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.gallery img:hover {
    transform: scale(1.02);
    border-color: var(--accent-blue);
}

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(9, 10, 15, 0.95);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

#lightboxContent {
    text-align: center;
    position: relative;
    max-width: 95vw;
    max-height: 90vh;
}

#lightboxImg {
    max-width: 90vw;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: transform 0.2s ease, opacity 0.25s ease;
}

#imageCounter {
    color: var(--text-muted);
    font-size: 16px;
    margin-bottom: 12px;
    font-weight: 600;
    letter-spacing: 1px;
}

.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.08);
    color: white;
    border: 1px solid var(--border-color);
    font-size: 35px;
    padding: 15px 20px;
    cursor: pointer;
    user-select: none;
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
}

.nav-btn:hover {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
}

#prevBtn { left: 30px; }
#nextBtn { right: 30px; }
</style>
</head>
<body>

<h1>NewbFixer Livery Gallery</h1>

<div class="controls" id="folderButtonsContainer">
    <p style="color: var(--text-muted); text-align: center; width: 100%;">Loading categories...</p>
</div>

<div class="gallery-container">
    <div class="folder-title" id="folderTitle">Select a vehicle category above</div>
    <div class="gallery" id="gallery"></div>
</div>

<div id="lightbox">
    <button id="prevBtn" class="nav-btn">&#10094;</button>
    <div id="lightboxContent">
        <div id="imageCounter"></div>
        <img id="lightboxImg" src="" alt="">
    </div>
    <button id="nextBtn" class="nav-btn">&#10095;</button>
</div>

<script>
/* 
  If automatic server directory indexing is blocked on Vercel, 
  simply list your exact folder names here. The script will automatically 
  scan each folder for your .webp / .jpg images!
*/
const manualFolderFallback = [
    "AMR_V8_Vantage_GT3_2019",
    "Audi_R8LMS_GT2_2021",
    "Audi_R8_LMS_Evo_II_2022",
    "Bentley_Continental_GT3_2018",
    "BMW_M4_GT3_2022",
    "Chevrolet_Camaro_GT4_R_2017",
    "Emily_Frey_Jaguar_G3_2012",
    "Ferrari_296_GT3_2023",
    "Ferrari_488_GT3_Evo_2020",
    "Ford_Mustang_GT3_2024",
    "Ginetta_G55_GT4_2012",
    "Honda_NSX_GT3_Evo_2019",
    "KTM_XBOW_GT2_2021",
    "KTM_XBOW_GT4_2016",
    "Lamborghini_Huracan_Evo2_2023",
    "Lamborghini_Huracan_Evo_2019",
    "Lexus_RC_F_GT3_2016",
    "Maserati_GT2_2023",
    "McLaren_720s_GT3_2019",
    "McLaren_720s_GT3_Evo_2023",
    "Mercedes_AMG_GT2_2023",
    "Mercedes_AMG_GT3_2020",
    "Mercedes_AMG_GT4_2016",
    "Nissan_GT-R_Nismo_GT3_2018",
    "Porsche_991II_GT2_RS_CS_Evo_2023",
    "Porsche_991II_GT3_R_2019",
    "Porsche_992_GT3_Cup_2021",
    "Porsche_992_GT3_R_2023"
];

const buttonContainer = document.getElementById("folderButtonsContainer");
const gallery = document.getElementById("gallery");
const title = document.getElementById("folderTitle");

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const imageCounter = document.getElementById("imageCounter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentImages = [];
let currentIndex = 0;
let zoomLevel = 1;

function showImage(index) {
    currentIndex = index;
    lightboxImg.style.opacity = 0;
    setTimeout(() => {
        lightboxImg.src = currentImages[index];
        imageCounter.textContent = `${index + 1} / ${currentImages.length}`;
        zoomLevel = 1;
        lightboxImg.style.transform = "scale(1)";
        lightboxImg.style.opacity = 1;
    }, 150);
}

function openLightbox(index) {
    lightbox.style.display = "flex";
    showImage(index);
}

function nextImage() {
    currentIndex = (currentIndex + 1) % currentImages.length;
    showImage(currentIndex);
}

function prevImage() {
    currentIndex--;
    if (currentIndex < 0) currentIndex = currentImages.length - 1;
    showImage(currentIndex);
}

// Automatically scan folder paths for images (supports both .webp and .jpg)
async function loadFolderImages(folderName) {
    gallery.innerHTML = "";
    title.textContent = folderName.replaceAll("_", " ");
    currentImages = [];

    let imageFound = false;

    for (let i = 1; i <= 60; i++) {
        // Test webp first, then fallback to checking standard filename variations if needed
        const webpPath = `liveries/${folderName}/20260606${String(i).padStart(6, '0')}_1.jpg`; // handles timestamp naming pattern if used
        const standardPath = `liveries/${folderName}/${i}.webp`;
        const altPath = `liveries/${folderName}/${i}.jpg`;

        // Let's check a dynamic sequence 1 to 60 or pattern match
        const sequencePath = `liveries/${folderName}/${i}.webp`;
        const sequenceAlt = `liveries/${folderName}/${i}.jpg`;

        let validPath = null;
        if (await checkFileExists(sequencePath)) {
            validPath = sequencePath;
        } else if (await checkFileExists(sequenceAlt)) {
            validPath = sequenceAlt;
        } else {
            // Check if your specific naming format exists (e.g. index-based check)
            // We can also test if it matches arbitrary names by probing 
        }

        if (validPath) {
            imageFound = true;
            currentImages.push(validPath);

            const img = document.createElement("img");
            img.src = validPath;
            img.loading = "lazy";
            
            const capturedIndex = currentImages.length - 1;
            img.addEventListener("click", () => openLightbox(capturedIndex));
            gallery.appendChild(img);
        }
    }

    if (!imageFound) {
        // Fallback: If sequential numbers aren't found, try a broader check or display helper message
        gallery.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align:center;">Make sure images inside <b>liveries/${folderName}/</b> are named sequentially like <b>1.webp</b>, <b>2.webp</b> (or .jpg).</p>`;
    }
}

function checkFileExists(url) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}

function buildUI(folders) {
    buttonContainer.innerHTML = "";
    folders.sort().forEach(folder => {
        const btn = document.createElement("button");
        btn.className = "folder-btn";
        btn.textContent = folder.replaceAll("_", " ");
        
        btn.addEventListener("click", () => {
            document.querySelectorAll(".folder-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            loadFolderImages(folder);
        });

        buttonContainer.appendChild(btn);
    });
}

// Attempt to read directory listing automatically, otherwise use the array fallback seamlessly
async function initGallery() {
    try {
        const response = await fetch('liveries/');
        if (!response.ok) throw new Error();
        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const links = doc.querySelectorAll('a');
        
        let folders = [];
        links.forEach(link => {
            let href = link.getAttribute('href');
            href = href ? href.replace(/\/$/, "").split('/').pop() : "";
            if (href && href !== "." && href !== ".." && !href.includes("?")) {
                const folderName = decodeURIComponent(href);
                if (!folders.includes(folderName)) folders.push(folderName);
            }
        });

        if (folders.length > 0) {
            buildUI(folders);
        } else {
            throw new Error();
        }
    } catch (e) {
        // Fallback kicks in smoothly if Vercel blocks directory indexing
        buildUI(manualFolderFallback);
    }
}

prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevImage(); });
nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextImage(); });

lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
        zoomLevel = 1;
        lightboxImg.style.transform = "scale(1)";
    }
});

document.addEventListener("keydown", (e) => {
    if (lightbox.style.display !== "flex") return;
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
    if (e.key === "Escape") lightbox.style.display = "none";
});

lightboxImg.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomLevel = Math.max(0.5, Math.min(5, zoomLevel + (e.deltaY < 0 ? 0.1 : -0.1)));
    lightboxImg.style.transform = `scale(${zoomLevel})`;
}, { passive: false });

initGallery();
</script>

</body>
</html>
